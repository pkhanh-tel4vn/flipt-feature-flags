version: "3"

services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    working_dir: /server
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - .:/server
      - ./config/config.yml:/etc/flipt/config.yml
      - ./opt/flipt:/var/opt/flipt
    command: ["mage", "go:run"]

  ui:
    depends_on:
      - server
    build: ./ui
    working_dir: /ui
    ports:
      - "5173:5173"
    volumes:
      - ./ui:/ui
      - exclude:/ui/node_modules
    environment:
      # Backend API address - use service name for Docker network communication
      - FLIPT_ADDRESS=http://server:8080
      - VITE_API_URL=http://localhost:8080
    command: ["npm", "run", "dev"]

volumes:
  exclude:
